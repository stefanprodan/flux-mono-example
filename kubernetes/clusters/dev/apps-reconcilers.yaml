apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-reconcilers
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 5m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: infra-reconcilers
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./apps/reconcilers
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-vars
