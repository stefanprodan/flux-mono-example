apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: OCIRepository
      name: metrics-server-chart
    patch: |
      - op: add
        path: /spec/insecure
        value: true
  - target:
      kind: HelmRelease
      name: metrics-server
    patch: |
      - op: add
        path: /spec/values/args
        value:
          - --kubelet-insecure-tls
