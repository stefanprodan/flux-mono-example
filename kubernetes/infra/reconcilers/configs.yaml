---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  sources:
    - alias: monorepo
      kind: OCIRepository
      name: flux-system
  commonMetadata:
    labels:
      role: infra-configs
  pathPattern: "@monorepo/infra/components/{app}/configs/envs/{env}"
  artifacts:
    - name: "{app}-{env}-configs"
      copy:
        - from: "@monorepo/infra/components/{app}/configs/base/**"
          to: "@artifact/base/"
        - from: "@monorepo/infra/components/{app}/configs/envs/{env}/**"
          to: "@artifact/envs/{env}/"
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  type: ExternalArtifact
  selectors:
    - matchLabels:
        role: infra-configs
        env: ${env}
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: infra-configs
  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: << inputs.app >>-configs
        namespace: << inputs.provider.namespace >>
      spec:
        interval: 30m
        retryInterval: 5m
        timeout: 5m
        prune: true
        wait: true
        dependsOn:
          - name: << inputs.app >>
        sourceRef:
          kind: ExternalArtifact
          name: << inputs.name >>
        path: ./envs/<< inputs.env >>
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: flux-vars
