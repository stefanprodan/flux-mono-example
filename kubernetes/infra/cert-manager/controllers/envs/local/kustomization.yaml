apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: OCIRepository
      name: cert-manager-chart
    patch: |
      - op: replace
        path: /spec/url
        value: oci://flux-registry:5000/charts/cert-manager
      - op: add
        path: /spec/insecure
        value: true
