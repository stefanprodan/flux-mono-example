---
apiVersion: v1
kind: Namespace
metadata:
  name: apps-${app_env}
  annotations:
    cluster-name: ${cluster_name}
    env: ${env}
    app-env: ${app_env}
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps-${app_env}
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileTimeout: "10m"
spec:
  wait: true
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: infra-controllers
      namespace: flux-system
      ready: true
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: flux-vars
        namespace: apps-${app_env}
        annotations:
          fluxcd.controlplane.io/copyFrom: "flux-system/flux-vars"
        labels:
          reconcile.fluxcd.io/watch: Enabled
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-egress
        namespace: apps-${app_env}
      spec:
        podSelector: {}
        policyTypes:
          - Egress
        egress:
          - {}
