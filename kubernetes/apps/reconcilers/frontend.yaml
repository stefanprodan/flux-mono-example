---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: frontend
  namespace: apps-${app_env}
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  type: OCIArtifactTag
  url: oci://${app_registry}/frontend
  insecure: ${app_registry_insecure}
  defaultValues:
    app: frontend
  filter:
    # The range must not start with a YAML indicator such as ">" or "|":
    # kustomize drops the quotes and post-build substitution would produce
    # invalid YAML. Use "x" (any), "6.14.x", "~6.14.0", "^6.14.0" (same major),
    # or "x || >=0.0.0-0" to include prereleases.
    semver: "${app_semver}"
    limit: 1
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: frontend
  namespace: apps-${app_env}
  annotations:
    fluxcd.controlplane.io/reconcileTimeout: "10m"
spec:
  wait: true
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: apps-${app_env}
      namespace: flux-system
      ready: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: frontend
  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: << inputs.app >>
        namespace: apps-${app_env}
      spec:
        interval: 30m
        retryInterval: 5m
        timeout: 5m
        prune: true
        wait: true
        targetNamespace: apps-${app_env}
        sourceRef:
          kind: ExternalArtifact
          name: << inputs.app >>-${app_env}
          namespace: flux-system
        path: ./envs/${app_env}
        images:
          - name: << inputs.app >>
            newName: ${app_registry}/<< inputs.app >>
            newTag: << inputs.tag | quote >>
            digest: << inputs.digest | quote >>
        postBuild:
          substitute:
            app_env: ${app_env}
          substituteFrom:
            - kind: ConfigMap
              name: flux-vars
