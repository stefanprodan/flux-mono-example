apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: frontend
    behavior: merge
    envs:
      - app.env
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: frontend
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
